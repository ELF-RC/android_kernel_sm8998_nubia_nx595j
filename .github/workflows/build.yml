name: Kernel Builder

on:
  push:
    branches:
      - main
      - KernelSU
  workflow_dispatch:
    inputs:
      localversion_name:
        description: 'Kernel Local Version Name'
        required: true
        default: 'ci'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.branch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      # One runner per branch; a failure on one must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - branch: main
            defconfig: lineageos_nx595j_defconfig
          - branch: KernelSU
            defconfig: lineageos_nx595j_ksu_defconfig

    env:
      ARCH: arm64
      # Empty on push, so the fallback keeps automated builds versioned 'ci'.
      LOCALVERSION_NAME: ${{ inputs.localversion_name || 'ci' }}
      BRANCH: ${{ matrix.branch }}
      DEFCONFIG: ${{ matrix.defconfig }}
      TOOLS: ${{ github.workspace }}/tooltmp

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 1

      - name: Create and enable 10G swap
        run: |
          # The runner root filesystem is only ~14G, so a 10G swapfile there
          # leaves no room for out/. Prefer the big scratch disk.
          SWAPDIR=/
          for d in /mnt /srv; do
            if [ -d "$d" ] && [ "$(df -Pm "$d" | awk 'NR==2 {print $4}')" -gt 20000 ]; then
              SWAPDIR="$d"
              break
            fi
          done
          SWAPFILE="$SWAPDIR/swapfile"
          echo "::notice::Creating 10G swap at $SWAPFILE"
          sudo fallocate -l 10G "$SWAPFILE" \
            || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=10240 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          sudo swapon --show
          free -h
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential lld libssl-dev libelf-dev flex bison bc \
            curl git time zip llvm openjdk-21-jdk-headless

      - name: Fetch submodules
        run: |
          git submodule update --init --recursive --depth 1

      - name: Fetch toolchain
        run: |
          git clone --depth=1 https://github.com/ELF-RC/android_kernel4x_tools.git "$TOOLS"

      - name: Set up environment
        run: |
          echo "$GITHUB_WORKSPACE/tooltmp/clang/host/linux-x86/clang-r428724/bin" >> "$GITHUB_PATH"
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/tooltmp/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu/bin/aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/tooltmp/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi/bin/arm-linux-gnueabi-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=Github-Action" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=${GITHUB_ACTOR,,}" >> "$GITHUB_ENV"
          jobs="$(nproc)"
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "::notice::Using $jobs CPUs for the kernel build"

      - name: Configure
        run: |
          make -j"$BUILD_JOBS" O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip \
            HOSTCC=clang HOSTCXX=clang++ LLVM_IAS=1 \
            KCFLAGS="--target=aarch64-linux-gnu" \
            LOCALVERSION="-${LOCALVERSION_NAME}" \
            "$DEFCONFIG"

      - name: Build kernel image
        run: |
          # CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y: Image.gz-dtb is the real target.
          make -j"$BUILD_JOBS" O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip \
            HOSTCC=clang HOSTCXX=clang++ LLVM_IAS=1 \
            KCFLAGS="--target=aarch64-linux-gnu" \
            LOCALVERSION="-${LOCALVERSION_NAME}" \
            Image.gz-dtb

      - name: Create patch directory
        run: |
          PATCH="$RUNNER_TEMP/patch"
          rm -rf "$PATCH"
          mkdir -p "$PATCH/split" "$PATCH/boot"
          echo "PATCH=$PATCH" >> "$GITHUB_ENV"

      - name: Stage stock boot image
        run: |
          cp "$GITHUB_WORKSPACE/MKBOOTIMG/boot.img" "$PATCH/stock.img"
          ls -l "$PATCH/stock.img"

      - name: Split Image.gz-dtb into kernel and dtb
        run: |
          MB="$GITHUB_WORKSPACE/MKBOOTIMG/magiskboot"
          chmod +x "$MB"
          GZDTB="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          test -s "$GZDTB" || { echo "::error::$GZDTB was not produced"; exit 1; }
          cd "$PATCH/split"
          cp "$GZDTB" image.gz-dtb
          "$MB" split image.gz-dtb
          # This magiskboot emits 'kernel' (decompressed) + 'kernel_dtb' (raw).
          test -f kernel     || { echo '::error::no kernel slot after split'; ls -l; exit 1; }
          test -f kernel_dtb || { echo '::error::no kernel_dtb slot after split'; ls -l; exit 1; }
          ls -l kernel kernel_dtb

      - name: Unpack stock boot image
        run: |
          MB="$GITHUB_WORKSPACE/MKBOOTIMG/magiskboot"
          cd "$PATCH/boot"
          # -h dumps 'header' so repack keeps the stock cmdline and page size.
          "$MB" unpack -h ../stock.img
          test -f kernel     || { echo '::error::no kernel slot after unpack'; ls -l; exit 1; }
          test -f kernel_dtb || { echo '::error::no kernel_dtb slot after unpack'; ls -l; exit 1; }
          ls -l

      - name: Replace kernel and dtb
        run: |
          cd "$PATCH/boot"
          cp "$PATCH/split/kernel" kernel
          cp "$PATCH/split/kernel_dtb" kernel_dtb
          ls -l kernel kernel_dtb

      - name: Repack boot image
        run: |
          MB="$GITHUB_WORKSPACE/MKBOOTIMG/magiskboot"
          cd "$PATCH/boot"
          "$MB" repack ../stock.img ../stock_unsign.img
          test -s "$PATCH/stock_unsign.img" || { echo '::error::repack produced nothing'; exit 1; }
          ls -l "$PATCH/stock_unsign.img"

      - name: Sign and verify boot image
        run: |
          SIG="$GITHUB_WORKSPACE/MKBOOTIMG/signer"
          cd "$PATCH"
          java -jar "$SIG/boot_signer.jar" /boot stock_unsign.img \
            "$SIG/verity.pk8" "$SIG/verity.x509.pem" boot.img
          java -jar "$SIG/boot_signer.jar" -verify boot.img
          DATE="$(date -u +%Y%m%d)"
          IMAGE_NAME="bootimg-${LOCALVERSION_NAME}-${BRANCH}-${DATE}.img"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          cp boot.img "$GITHUB_WORKSPACE/$IMAGE_NAME"
          sha1sum "$GITHUB_WORKSPACE/$IMAGE_NAME"
          ls -l "$GITHUB_WORKSPACE/$IMAGE_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # GitHub zips every artifact and names it <artifact-name>.zip, so this
          # downloads as <image name>.zip without doubling the extension.
          name: ${{ env.IMAGE_NAME }}

          path: ${{ env.IMAGE_NAME }}
          if-no-files-found: error
          retention-days: 30
